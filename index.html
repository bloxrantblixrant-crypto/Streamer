<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streamer University</title>

<style>
:root{
  --bg:#07090d;
  --panel:#0d1118;
  --panel2:#111722;
  --panel3:#161d29;
  --line:#222b39;
  --text:#f5f7fb;
  --muted:#8994a6;
  --accent:#7657ff;
  --accent2:#9a84ff;
  --green:#40d37d;
  --red:#ff5966;
  --yellow:#ffc857;
  --scale:1;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 10%,rgba(118,87,255,.18),transparent 30%),
    radial-gradient(circle at 80% 90%,rgba(70,120,255,.08),transparent 30%),
    var(--bg);
}

.auth-box{
  width:min(430px,100%);
  background:rgba(13,17,24,.96);
  border:1px solid var(--line);
  border-radius:24px;
  padding:32px;
  box-shadow:0 30px 100px rgba(0,0,0,.5);
  animation:appear .4s ease;
}

.logo{
  font-size:23px;
  font-weight:950;
  letter-spacing:-1px;
}

.logo span{
  color:var(--accent2);
}

.auth-desc{
  color:var(--muted);
  margin:9px 0 27px;
  font-size:13px;
  line-height:1.5;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#aab3c1;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.input,
.textarea,
.select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  background:#080c12;
  color:white;
  outline:none;
  padding:13px;
  transition:.2s;
}

.textarea{
  min-height:110px;
  resize:vertical;
}

.input:focus,
.textarea:focus,
.select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(118,87,255,.12);
}

.primary{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  color:white;
  background:var(--accent);
  font-weight:900;
  transition:.2s;
}

.primary:hover{
  background:var(--accent2);
  transform:translateY(-1px);
}

.error{
  min-height:18px;
  color:var(--red);
  font-size:12px;
  margin-top:10px;
}

.note{
  margin-top:18px;
  padding:12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#10151d;
  color:#697587;
  font-size:11px;
  line-height:1.5;
}

/* APP */

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  z-index:100;
  display:flex;
  flex-direction:column;
  padding:20px 13px;
  background:#090c12;
  border-right:1px solid var(--line);
  transition:transform .25s ease;
}

.sidebar-logo{
  padding:7px 10px 25px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav-label{
  margin:18px 11px 7px;
  color:#4f5969;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.2px;
}

.nav-btn{
  width:100%;
  border:1px solid transparent;
  border-radius:10px;
  padding:12px;
  background:transparent;
  color:#8490a2;
  text-align:left;
  font-size:12px;
  font-weight:800;
  transition:.2s;
}

.nav-btn:hover{
  background:#111722;
  color:white;
}

.nav-btn.active{
  color:white;
  background:#18132a;
  border-color:#32295a;
}

.sidebar-bottom{
  margin-top:auto;
}

.mini-user{
  border:1px solid var(--line);
  border-radius:13px;
  background:#0d1219;
  padding:12px;
}

.mini-user strong{
  display:block;
  font-size:12px;
}

.mini-user span{
  display:block;
  color:#6d7889;
  margin-top:3px;
  font-size:10px;
}

.logout{
  width:100%;
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:transparent;
  color:#8994a6;
  padding:10px;
  font-size:11px;
  font-weight:800;
}

.logout:hover{
  background:#171019;
  color:#ff727b;
}

.main{
  min-height:100vh;
  margin-left:250px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:80;
  height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 28px;
  background:rgba(7,9,13,.86);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(16px);
}

.menu{
  display:none;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#111722;
  color:white;
  font-size:20px;
}

.top-title{
  font-size:15px;
  font-weight:900;
}

.top-space{
  flex:1;
}

.top-user{
  color:#707b8c;
  font-size:12px;
}

.page{
  width:min(1500px,100%);
  margin:auto;
  padding:30px;
  animation:up .3s ease;
}

.head{
  display:flex;
  align-items:flex-start;
  gap:15px;
  margin-bottom:24px;
}

.head-main{
  flex:1;
}

.title{
  margin:0;
  font-size:clamp(26px,4vw,36px);
  font-weight:950;
  letter-spacing:-1.5px;
}

.subtitle{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.grid{
  display:grid;
  gap:15px;
}

.stats{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.two{
  grid-template-columns:1.4fr 1fr;
  margin-top:15px;
}

.card{
  min-width:0;
  background:linear-gradient(145deg,#0e131b,#0b0f15);
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px;
  transition:.2s;
}

.card:hover{
  border-color:#303a4a;
}

.stat-label{
  color:#6e798b;
  font-size:10px;
  font-weight:900;
  letter-spacing:.7px;
}

.stat-value{
  margin-top:7px;
  font-size:29px;
  font-weight:950;
}

.stat-sub{
  margin-top:4px;
  color:#596577;
  font-size:10px;
}

.section{
  margin:0 0 14px;
  font-size:15px;
  font-weight:900;
}

.course-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.course-title{
  font-size:18px;
  font-weight:900;
}

.course-desc{
  min-height:40px;
  margin-top:7px;
  color:#7d889a;
  font-size:12px;
  line-height:1.5;
}

.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:15px 0 7px;
  color:#758093;
  font-size:10px;
  font-weight:800;
}

.progress{
  height:7px;
  overflow:hidden;
  border-radius:50px;
  background:#1b2330;
}

.progress span{
  display:block;
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .7s ease;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.btn{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  background:#111722;
  color:white;
  font-size:11px;
  font-weight:850;
  transition:.18s;
}

.btn:hover{
  background:#1a2230;
  border-color:#374253;
  transform:translateY(-1px);
}

.btn.primary-btn{
  background:var(--accent);
  border-color:var(--accent);
}

.btn.primary-btn:hover{
  background:var(--accent2);
}

.btn.danger{
  color:#ff7881;
  background:#180d11;
  border-color:#402027;
}

.btn.success{
  color:#60df94;
  background:#0d1913;
  border-color:#204532;
}

.empty{
  padding:25px;
  text-align:center;
  color:#606c7e;
  font-size:12px;
}

/* LESSONS */

.lesson-list{
  display:grid;
  gap:8px;
}

.lesson{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1017;
}

.lesson-number{
  flex:none;
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:#171e29;
  color:#9ba5b4;
  font-size:10px;
  font-weight:900;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-name{
  font-size:12px;
  font-weight:850;
}

.lesson-meta{
  margin-top:3px;
  color:#657184;
  font-size:10px;
}

.done{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

/* ANNOUNCEMENTS */

.announcement{
  margin-bottom:9px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0c1118;
}

.announcement:last-child{
  margin-bottom:0;
}

.announcement-title{
  font-size:13px;
  font-weight:900;
}

.announcement-message{
  margin-top:5px;
  color:#8994a5;
  font-size:11px;
  line-height:1.55;
}

.announcement-date{
  margin-top:8px;
  color:#5d6879;
  font-size:9px;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:50px;
  font-size:9px;
  font-weight:900;
}

.badge.active{
  color:#5ee291;
  border-color:#214733;
  background:#0d1913;
}

.badge.suspended{
  color:#ff717b;
  border-color:#422029;
  background:#190d11;
}

/* ADMIN */

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:15px;
}

.tab{
  flex:none;
  border:1px solid var(--line);
  border-radius:9px;
  background:#0d1219;
  color:#737e90;
  padding:9px 12px;
  font-size:10px;
  font-weight:900;
}

.tab.active{
  background:#19142b;
  color:white;
  border-color:#342a5c;
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:13px;
}

table{
  width:100%;
  min-width:720px;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:11px;
}

th{
  color:#667183;
  background:#0b0f15;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

td{
  color:#b6bfcc;
}

tr:last-child td{
  border-bottom:0;
}

.command-layout{
  grid-template-columns:1.3fr 1fr;
}

.command-input{
  display:flex;
  gap:7px;
}

.command-input .input{
  flex:1;
}

.command-output{
  height:230px;
  margin-top:10px;
  overflow:auto;
  padding:12px;
  border:1px solid #1d2531;
  border-radius:12px;
  background:#06090d;
  color:#9aa5b6;
  font:10px ui-monospace,SFMono-Regular,Menlo,monospace;
}

.command-line{
  margin-bottom:6px;
}

.command-line.info{
  color:#9a86ff;
}

.command-line.ok{
  color:#5fdf92;
}

.command-line.err{
  color:#ff727c;
}

.command-help{
  padding:10px;
  margin-bottom:7px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0b1017;
}

.command-help code{
  color:#ad9eff;
  font-size:10px;
}

.command-help div{
  margin-top:4px;
  color:#667284;
  font-size:10px;
}

/* MODAL */

.modal-layer{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  animation:fade .18s ease;
}

.modal{
  width:min(540px,100%);
  max-height:90vh;
  overflow:auto;
  padding:21px;
  border:1px solid #2b3545;
  border-radius:19px;
  background:#0d1219;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
  animation:modalIn .2s ease;
}

.modal-head{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-bottom:18px;
}

.modal-head-main{
  flex:1;
}

.modal-title{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.modal-sub{
  margin-top:4px;
  color:#687486;
  font-size:10px;
}

.close{
  flex:none;
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#111722;
  color:#9ca6b5;
  font-size:20px;
  line-height:1;
}

.close:hover{
  color:white;
  background:#1a202c;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:7px;
  margin-top:18px;
}

/* OVERLAY */

.mobile-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.6);
}

/* TOAST */

.toasts{
  position:fixed;
  right:17px;
  bottom:17px;
  z-index:1000;
  width:min(350px,calc(100% - 34px));
  display:grid;
  gap:7px;
}

.toast{
  padding:13px;
  border:1px solid #2c3543;
  border-radius:12px;
  background:#121923;
  color:#e5e9ef;
  font-size:11px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  animation:toastIn .25s ease;
}

.toast.success{
  border-color:#255039;
}

.toast.error{
  border-color:#49232b;
}

/* RESPONSIVE */

@media(max-width:1050px){
  .stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .two,
  .command-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-overlay.open{
    display:block;
  }

  .main{
    margin-left:0;
  }

  .menu{
    display:block;
  }

  .topbar{
    padding:0 15px;
  }

  .top-user{
    display:none;
  }

  .page{
    padding:20px 15px;
  }

  .course-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){
  .auth{
    padding:12px;
  }

  .auth-box{
    padding:24px 18px;
  }

  .stats{
    gap:9px;
  }

  .card{
    padding:15px;
  }

  .stat-value{
    font-size:22px;
  }

  .command-input{
    flex-direction:column;
  }

  .command-input .btn{
    width:100%;
  }
}

@media(max-width:350px){
  .stats{
    grid-template-columns:1fr;
  }

  .page{
    padding:15px 11px;
  }
}

/* ANIMATIONS */

@keyframes appear{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

@keyframes up{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.96) translateY(5px)}
  to{opacity:1;transform:none}
}

@keyframes toastIn{
  from{opacity:0;transform:translateX(20px)}
  to{opacity:1;transform:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="auth">
  <div class="auth-box">

    <div class="logo">
      STREAMER <span>UNIVERSITY</span>
    </div>

    <div class="auth-desc">
      Creator education, progress and community.
    </div>

    <form id="loginForm">

      <div class="field">
        <label>Username</label>
        <input
          id="loginUsername"
          class="input"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          id="loginPassword"
          class="input"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="primary" type="submit">
        Sign in
      </button>

      <div id="loginError" class="error"></div>
    </form>

    <div class="note">
      Streamer accounts can only be created by the administrator.
    </div>

  </div>
</div>


<!-- APPLICATION -->
<div id="application" class="app hidden">

  <div id="mobileOverlay" class="mobile-overlay"></div>

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-logo">
      <div class="logo">
        STREAMER <span>UNIVERSITY</span>
      </div>
    </div>

    <nav class="nav">

      <button class="nav-btn" data-nav="dashboard">
        Dashboard
      </button>

      <button class="nav-btn" data-nav="courses">
        Courses
      </button>

      <button class="nav-btn" data-nav="announcements">
        Announcements
      </button>

      <button class="nav-btn" data-nav="profile">
        Profile
      </button>

      <div id="adminNavigation" class="hidden">
        <div class="nav-label">ADMINISTRATION</div>

        <button class="nav-btn" data-nav="admin">
          Admin Panel
        </button>
      </div>

    </nav>

    <div class="sidebar-bottom">

      <div class="mini-user">
        <strong id="miniUsername"></strong>
        <span id="miniRole"></span>
      </div>

      <button id="logoutButton" class="logout">
        Log out
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <button id="menuButton" class="menu">
        ≡
      </button>

      <div id="topTitle" class="top-title">
        Dashboard
      </div>

      <div class="top-space"></div>

      <div id="topUsername" class="top-user"></div>

    </header>

    <div id="content"></div>

  </main>

</div>


<div id="modalRoot"></div>
<div id="toastRoot" class="toasts"></div>


<script>

function createDefaultDB(){

  return {
    version:10,

    users:[
      {
        username:"Alteo",
        password:"Alteo202",
        role:"admin",
        status:"active",
        xp:0,
        completed:[],
        createdAt:new Date().toISOString()
      }
    ],

    courses:JSON.parse(JSON.stringify(DEFAULT_COURSES)),

    announcements:[
      {
        id:"welcome",
        title:"Welcome to Streamer University",
        message:"Your creator journey starts here. Complete lessons to earn XP and level up.",
        createdAt:new Date().toISOString()
      }
    ]
  };
}

function loadDatabase(){

  try{

    const saved=localStorage.getItem(DB_KEY);

    if(!saved){
      const fresh=createDefaultDB();
      localStorage.setItem(DB_KEY,JSON.stringify(fresh));
      return fresh;
    }

    const data=JSON.parse(saved);

    if(
      !data ||
      !Array.isArray(data.users) ||
      !Array.isArray(data.courses)
    ){
      throw new Error("Invalid database");
    }

    if(!Array.isArray(data.announcements)){
      data.announcements=[];
    }

    data.users.forEach(user=>{
      if(!Array.isArray(user.completed)){
        user.completed=[];
      }

      if(typeof user.xp!=="number"){
        user.xp=0;
      }

      if(!user.status){
        user.status="active";
      }
    });

    if(!data.users.some(
      user=>user.username==="Alteo" && user.role==="admin"
    )){
      data.users.unshift({
        username:"Alteo",
        password:"Alteo202",
        role:"admin",
        status:"active",
        xp:0,
        completed:[],
        createdAt:new Date().toISOString()
      });
    }

    return data;

  }catch(error){

    const fresh=createDefaultDB();
    localStorage.setItem(DB_KEY,JSON.stringify(fresh));
    return fresh;
  }
}

let database=loadDatabase();

function saveDatabase(){
  localStorage.setItem(
    DB_KEY,
    JSON.stringify(database)
  );
}

function findUser(username){

  if(!username) return null;

  return database.users.find(
    user=>user.username.toLowerCase()===String(username).toLowerCase()
  ) || null;
}

function streamerList(){
  return database.users.filter(
    user=>user.role==="streamer"
  );
}

function id(prefix){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function levelFromXP(xp){
  return Math.floor(Math.max(0,xp)/100)+1;
}

function xpProgress(xp){
  return Math.max(0,xp)%100;
}

function totalLessons(){

  return database.courses.reduce(
    (total,course)=>total+course.lessons.length,
    0
  );
}

function completedLessons(user){
  return Array.isArray(user.completed)
    ? user.completed.length
    : 0;
}

function coursePercent(user,course){

  if(!course.lessons.length) return 0;

  const done=course.lessons.filter(
    lesson=>user.completed.includes(lesson.id)
  ).length;

  return Math.round(
    done/course.lessons.length*100
  );
}

function dateText(date){

  try{
    return new Date(date).toLocaleDateString(
      undefined,
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );
  }catch{
    return "Unknown";
  }
}

document

function navigate(page,courseId=null){

  const titles={
    dashboard:"Dashboard",
    courses:"Courses",
    announcements:"Announcements",
    profile:"Profile",
    admin:"Admin Panel"
  };

  document.getElementById("topTitle")
    .textContent=titles[page] || "Dashboard";

  document
    .querySelectorAll("[data-nav]")
    .forEach(button=>{
      button.classList.toggle(
        "active",
        button.dataset.nav===page
      );
    });

  render();
}


function render(){

  if(currentPage==="dashboard"){

  else if(currentPage==="courses"){

  }

  else if(currentPage==="profile"){
    content.innerHTML=renderProfile();
  }

  else if(currentPage==="admin"){
    content.innerHTML=renderAdmin();
  }

  bindEvents();
}

function openLesson(courseId,lessonId){

  const course=database.courses.find(
    c=>c.id===courseId
  );

  if(!course) return;

  const lesson=course.lessons.find(
    l=>l.id===lessonId
  );

  if(!lesson) return;

  const alreadyDone=
    currentUser.completed.includes(lesson.id);

  openModal(`

    <div class="modal-head">

      <div class="modal-head-main">

        <h2 class="modal-title">
          ${escapeHTML(lesson.title)}
        </h2>

        <div class="modal-sub">
          ${escapeHTML(course.title)}
        </div>

      </div>

      <button
        type="button"
        class="close"
        data-close-modal
        aria-label="Close"
      >
        ×
      </button>

    </div>


    <div style="
      color:#b7c0cd;
      font-size:13px;
      line-height:1.8;
    ">
      ${escapeHTML(lesson.text)}
    </div>


    <div class="note">
      Completing this lesson awards 25 XP.
    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="btn"
        data-close-modal
      >
        Close
      </button>

      ${
        alreadyDone

        ? `
          <button
            type="button"
            class="btn success"
            disabled
          >
            Completed
          </button>
        `

        : `
          <button
            type="button"
            class="btn primary-btn"
            data-complete-lesson
            data-course="${escapeHTML(course.id)}"
            data-lesson="${escapeHTML(lesson.id)}"
          >
            Complete Lesson +25 XP
          </button>
        `
      }

    </div>

  `);

  // The lesson modal is created AFTER the page render, so bind
  // its buttons now instead of waiting for another render.
  bindEvents();
}


function completeLesson(courseId,lessonId){

  if(currentUser.role==="admin"){
    showToast(
      "Admin preview cannot earn XP.",
      "error"
    );
    return;
  }

  const user=findUser(currentUser.username);

  if(!user){
    showToast("User no longer exists.","error");
    return;
  }

  if(user.completed.includes(lessonId)){
    closeModal();
    return;
  }

  const course=database.courses.find(
    c=>c.id===courseId
  );

  if(!course){
    showToast("Course not found.","error");
    return;
  }

  const lesson=course.lessons.find(
    l=>l.id===lessonId
  );

  if(!lesson){
    showToast("Lesson not found.","error");
    return;
  }

  user.completed.push(lessonId);
  user.xp=Math.max(0,user.xp)+25;

  saveDatabase();

  currentUser=findUser(user.username);

  closeModal();

  showToast(
    "Lesson completed. +25 XP",
    "success"
  );

  render();
}

/* =========================================================
   COMMAND ENGINE
========================================================= */

function executeCommand(raw){

  const input=raw.trim();

  if(!input) return;

  addCommand("> "+input,"info");

  if(!input.startsWith("/")){

    addCommand(
      "Commands must start with /.",
      "err"
    );

    return;
  }

  const body=input.slice(1).trim();
  const parts=body.split(/\s+/);
  const command=(parts.shift()||"").toLowerCase();

  if(command==="help"){

    addCommand(
      "Commands: /create /delete /suspend /activate /givexp /removexp /setxp /setlevel /resetprogress /resetpass /view /announce /clearannouncements /courses /export /resetdb",
      "ok"
    );

    return;
  }


  if(command==="create"){

    const username=parts[0];
    const password=parts[1];

    if(!username || !password){

      addCommand(
        "Usage: /create username password",
        "err"
      );

      return;
    }

    if(username.toLowerCase()==="alteo"){

      addCommand(
        "That username is reserved.",
        "err"
      );

      return;
    }

    if(findUser(username)){

      addCommand(
        "That username already exists.",
        "err"
      );

      return;
    }

    database.users.push({
      username,
      password,
      role:"streamer",
      status:"active",
      xp:0,
      completed:[],
      createdAt:new Date().toISOString()
    });

    saveDatabase();

    addCommand(
      "Created streamer "+username+".",
      "ok"
    );

    return;
  }


  if(
    command==="delete" ||
    command==="suspend" ||
    command==="activate"
  ){

    const username=parts[0];
    const user=findUser(username);

    if(!user || user.role==="admin"){

      addCommand(
        "Streamer not found.",
        "err"
      );

      return;
    }

    if(command==="delete"){

      if(!confirm(
        "Delete streamer \""+
        user.username+
        "\"?"
      )){
        addCommand(
          "Delete cancelled.",
          "info"
        );
        return;
      }

      database.users=
        database.users.filter(
          u=>u!==user
        );

      saveDatabase();

      addCommand(
        "Deleted "+username+".",
        "ok"
      );

      return;
    }

    user.status=
      command==="suspend"
      ? "suspended"
      : "active";

    saveDatabase();

    addCommand(
      username+" is now "+user.status+".",
      "ok"
    );

    return;
  }


  if(
    command==="givexp" ||
    command==="removexp" ||
    command==="setxp"
  ){

    const username=parts[0];
    const amount=Number(parts[1]);
    const user=findUser(username);

    if(!user || user.role==="admin"){

      addCommand(
        "Streamer not found.",
        "err"
      );

      return;
    }

    if(!Number.isFinite(amount) || amount<0){

      addCommand(
        "Amount must be 0 or higher.",
        "err"
      );

      return;
    }

    if(command==="givexp"){
      user.xp+=Math.floor(amount);
    }

    if(command==="removexp"){
      user.xp=Math.max(
        0,
        user.xp-Math.floor(amount)
      );
    }

    if(command==="setxp"){
      user.xp=Math.floor(amount);
    }

    saveDatabase();

    addCommand(
      username+" now has "+user.xp+" XP.",
      "ok"
    );

    return;
  }


  if(command==="setlevel"){

    const username=parts[0];
    const level=Number(parts[1]);
    const user=findUser(username);

    if(!user || user.role==="admin"){

      addCommand(
        "Streamer not found.",
        "err"
      );

      return;
    }

    if(
      !Number.isInteger(level) ||
      level<1
    ){

      addCommand(
        "Level must be a whole number above 0.",
        "err"
      );

      return;
    }

    user.xp=(level-1)*100;

    saveDatabase();

    addCommand(
      username+" is now level "+level+".",
      "ok"
    );

    return;
  }


  if(command==="resetprogress"){

    const username=parts[0];
    const user=findUser(username);

    if(!user || user.role==="admin"){

      addCommand(
        "Streamer not found.",
        "err"
      );

      return;
    }

    user.xp=0;
    user.completed=[];

    saveDatabase();

    addCommand(
      "Progress reset for "+username+".",
      "ok"
    );

    return;
  }


  if(command==="resetpass"){

    const username=parts[0];
    const password=parts[1];
    const user=findUser(username);

    if(!user || user.role==="admin"){

      addCommand(
        "Streamer not found.",
        "err"
      );

      return;
    }

    if(!password){

      addCommand(
        "Usage: /resetpass username password",
        "err"
      );

      return;
    }

    user.password=password;

    saveDatabase();

    addCommand(
      "Password changed for "+username+".",
      "ok"
    );

    return;
  }


  if(command==="view"){

    const username=parts[0];
    const user=findUser(username);

    if(!user){

      addCommand(
        "User not found.",
        "err"
      );

      return;
    }

    addCommand(
      user.username+
      " | "+
      user.role+
      " | "+
      user.status+
      " | Level "+
      levelFromXP(user.xp)+
      " | "+
      user.xp+
      " XP | "+
      completedLessons(user)+
      " lessons",
      "ok"
    );

    return;
  }


  if(command==="announce"){

    const announceText=
      input.slice("/announce".length).trim();

    const pieces=announceText.split("|");

    if(pieces.length<2){

      addCommand(
        "Usage: /announce title | message",
        "err"
      );

      return;
    }

    const title=pieces.shift().trim();
    const message=pieces.join("|").trim();

    if(!title || !message){

      addCommand(
        "Title and message are required.",
        "err"
      );

      return;
    }

    database.announcements.push({
      id:id("announcement"),
      title,
      message,
      createdAt:new Date().toISOString()
    });

    saveDatabase();

    addCommand(
      "Announcement published.",
      "ok"
    );

    return;
  }


  if(command==="clearannouncements"){

    if(!confirm(
      "Delete every announcement?"
    )){
      addCommand(
        "Cancelled.",
        "info"
      );
      return;
    }

    database.announcements=[];

    saveDatabase();

    addCommand(
      "All announcements cleared.",
      "ok"
    );

    return;
  }


  if(command==="courses"){

    addCommand(
      database.courses.length+
      " courses and "+
      totalLessons()+
      " lessons.",
      "ok"
    );

    return;
  }


  if(command==="export"){

    exportDatabase();

    addCommand(
      "Database exported.",
      "ok"
    );

    return;
  }


  if(command==="resetdb"){

    if(!confirm(
      "RESET THE ENTIRE DATABASE? This cannot be undone."
    )){
      addCommand(
        "Reset cancelled.",
        "info"
      );
      return;
    }

    database=createDefaultDB();
    saveDatabase();

    currentUser=findUser("Alteo");

    addCommand(
      "Database reset successfully.",
      "ok"
    );

    render();

    return;
  }


  addCommand(
    "Unknown command. Type /help.",
    "err"
  );
}


function addCommand(text,type=""){

  const output=document.getElementById(
    "commandOutput"
  );

  if(!output) return;

  const line=document.createElement("div");

  line.className=
    "command-line "+
    type;

  line.textContent=text;

  output.appendChild(line);

  output.scrollTop=output.scrollHeight;
}

function openModal(html){

  const root=document.getElementById("modalRoot");

  root.innerHTML=`

    <div
      class="modal-layer"
      data-modal-background
    >

      <div class="modal">
        ${html}
      </div>

    </div>

  `;

  const background=
    root.querySelector("[data-modal-background]");

  background.addEventListener(
    "click",
    function(event){

      if(event.target===background){
        closeModal();
      }

    }
  );

  document.body.style.overflow="hidden";
}


function closeModal(){

  document.getElementById(
    "modalRoot"
  ).innerHTML="";

  document.body.style.overflow="";
}

          "Password must contain at least 3 characters.";

          "That username is reserved.";

        return;
      }


      if(findUser(username)){

          "That username already exists.";

        role:"streamer",

        status:"active",

      });


      saveDatabase();

      closeModal();

function deleteUser(username){

  const user=findUser(username);

    "Delete streamer \""+

function deleteCourse(courseId){

  const course=database.courses.find(
    c=>c.id===courseId
  );

  if(!course) return;

  if(!confirm(
    "Delete \""+
    course.title+
    "\" and all its lessons?"
  )){
    return;
  }

  database.courses=
    database.courses.filter(
      c=>c.id!==courseId
    );

  saveDatabase();

  showToast(
    "Course deleted.",
    "success"
  );

  render();
}


function deleteLesson(courseId,lessonId){

  const course=database.courses.find(
    c=>c.id===courseId
  );

  if(!course) return;

  if(!confirm(
    "Delete this lesson?"
  )){
    return;
  }

  course.lessons=
    course.lessons.filter(
      lesson=>lesson.id!==lessonId
    );

  database.users.forEach(user=>{
    user.completed=
      user.completed.filter(
        id=>id!==lessonId
      );
  });

  saveDatabase();

  showToast(
    "Lesson deleted.",
    "success"
  );

  render();
}

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportDatabase(){

  const blob=new Blob(
    [
      JSON.stringify(
        database,
        null,
        2
      )
    ],
    {
      type:"application/json"
    }
  );

  const url=
    URL.createObjectURL(blob);

  const link=
    document.createElement("a");

  link.href=url;

  link.download=
    "streamer-university-database.json";

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}


function importDatabase(file){

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const imported=
        JSON.parse(reader.result);

      if(
        !imported ||
        !Array.isArray(imported.users) ||
        !Array.isArray(imported.courses)
      ){
        throw new Error();
      }

      if(
        !imported.users.some(
          user=>
            user.username==="Alteo" &&
            user.role==="admin"
        )
      ){

        imported.users.unshift({

          username:"Alteo",

          password:"Alteo202",

          role:"admin",

          status:"active",

          xp:0,

          completed:[],

          createdAt:new Date().toISOString()

        });

      }

      if(
        !Array.isArray(
          imported.announcements
        )
      ){
        imported.announcements=[];
      }

      database=imported;

      saveDatabase();

      currentUser=
        findUser(currentUser.username) ||
        findUser("Alteo");

      showToast(
        "Database imported.",
        "success"
      );

      render();

    }catch{

      showToast(
        "Invalid database file.",
        "error"
      );

    }

  };

  reader.readAsText(file);
}


/* =========================================================
   SCALE
========================================================= */

function getScaleSettings(){

  try{

    const raw=
      localStorage.getItem(SCALE_KEY);

    if(!raw){

      return {
        mode:"auto",
        value:100
      };

    }

    return JSON.parse(raw);

  }catch{

    return {
      mode:"auto",
      value:100
    };

  }
}


function autoScale(){

  const width=window.innerWidth;

  if(width<=340) return .80;

  if(width<=380) return .85;

  if(width<=430) return .90;

  if(width<=600) return .95;

  return 1;
}


function getScalePercent(){

  const settings=
    getScaleSettings();

  if(settings.mode==="auto"){

    return Math.round(
      autoScale()*100
    );

  }

  return Math.min(
    120,
    Math.max(
      80,
      Number(settings.value)||100
    )
  );
}


function applyScale(){

  const settings=
    getScaleSettings();

  const scale=
    settings.mode==="auto"
    ? autoScale()
    : Math.min(
        1.2,
        Math.max(
          .8,
          Number(settings.value)/100
        )
      );

  document.documentElement.style
    .setProperty(
      "--scale",
      scale
    );

  /*
    zoom is used only for the application.
    Responsive CSS still handles layout.
  */
  document.getElementById("application")
    ?.style.setProperty(
      "zoom",
      scale
    );
}


function saveScale(mode,value){

  localStorage.setItem(
    SCALE_KEY,
    JSON.stringify({
      mode,
      value
    })
  );

  applyScale();
}

applyScale();

window.addEventListener(
  "resize",
  function(){

    if(
      getScaleSettings().mode==="auto"
    ){
      applyScale();
    }

  }
);

          if(
            this.dataset.xpAction==="remove"

          render();

        }
      );

    });


  document
    .querySelectorAll("[data-scale-100]")
    .forEach(button=>{

      button.addEventListener(
        "click",
        function(){

          saveScale(
            "manual",
            100
          );

          render();

        }
      );

    });

}


/* =========================================================
   MOBILE
========================================================= */

const sidebar=
  document.getElementById(
    "sidebar"
  );

const mobileOverlay=
  document.getElementById(
    "mobileOverlay"
  );

document
  .getElementById("menuButton")
  .addEventListener(
    "click",
    function(){

      sidebar.classList.add("open");
      mobileOverlay.classList.add("open");

    }
  );


mobileOverlay.addEventListener(
  "click",
  closeMobileMenu
);


function closeMobileMenu(){

  sidebar.classList.remove(
    "open"
  );

  mobileOverlay.classList.remove(
    "open"
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message,type=""){

  const root=
    document.getElementById(
      "toastRoot"
    );

  const toast=
    document.createElement("div");

  toast.className=
    "toast "+type;

  toast.textContent=message;

  root.appendChild(toast);

  setTimeout(
    ()=>{
      toast.style.opacity="0";
      toast.style.transform=
        "translateX(15px)";

      setTimeout(
        ()=>toast.remove(),
        250
      );
    },
    2800
  );
}


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Escape"){

      closeModal();
      closeMobileMenu();

    }

  }
);


/* =========================================================
   INITIAL
========================================================= */

const savedUsername = localStorage.getItem("STREAMER_UNIVERSITY_USER");

if(savedUsername){
  const savedUser = findUser(savedUsername);

  if(savedUser && savedUser.status !== "suspended"){
    currentUser = savedUser;

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("application").classList.remove("hidden");

    updateUserUI();
    navigate("dashboard");
  }else{
    localStorage.removeItem("STREAMER_UNIVERSITY_USER");
  }
}

</script>
